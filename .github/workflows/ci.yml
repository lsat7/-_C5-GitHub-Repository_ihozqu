name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify version
        run: python challenge_audit.py --version

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Dogfood — audit this repo (must pass)
        run: python challenge_audit.py . --no-timestamp --format json

      - name: Demo PASS case (exit code 0)
        shell: bash
        run: |
          python challenge_audit.py examples/demo-good --no-timestamp --out /tmp/good.md
          grep -q "4/4 PASS" /tmp/good.md

      - name: Demo FAIL case (exit code 1 expected)
        shell: bash
        run: |
          set +e
          python challenge_audit.py examples/demo-bad --no-timestamp --out /tmp/bad.md
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit 1, got $code"; exit 1; fi
          grep -q "1/4 PASS" /tmp/bad.md
