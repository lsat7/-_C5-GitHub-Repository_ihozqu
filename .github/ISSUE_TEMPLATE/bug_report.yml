name: Bug 报告
about: 报告一个可复现的问题
title: "[Bug] "
labels: bug
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题！请尽量提供可复现信息，帮助我们快速定位。

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 简要描述问题
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现命令
      description: 贴出你运行的完整命令
      render: bash
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际输出
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望输出
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Ubuntu/Linux
        - macOS
        - 其他
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "例如 3.11.8"
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 自查
      value: |
        - [ ] 我用 `python challenge_audit.py --version` 确认了版本
        - [ ] 我搜索过已有 Issue，确认不是重复问题
