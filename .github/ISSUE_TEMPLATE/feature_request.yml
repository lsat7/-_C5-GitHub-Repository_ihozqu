name: 功能建议
about: 提出一个改进想法
title: "[Feature] "
labels: enhancement
assignees: ''

body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议！请说明使用场景，这比单纯描述功能更有帮助。

  - type: textarea
    id: problem
    attributes:
      label: 它解决什么问题
      description: 你在什么场景下遇到了不便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: 输入 / 输出示例
      description: 如果能给出命令和期望输出，会大大加快评估
      render: bash
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 该功能可用标准库实现（不引入第三方依赖）
          required: false
